[project]
name = "bblocks"
version = "3.0.0"
description = "Building blocks for development data."
authors = [
    {name = "ONE Campaign"},
    {name = "Luca Picci",email = "lpicci96@gmail.com"},
    {name = "Jorge Rivera", email = "jorge.rivera@one.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.3,<3",
    # <3 is a stated cap, not a stale one: WEO reads REF_AREA_IMF_CODE, which
    # imf-reader's docstring marks as a compatibility column slated for
    # removal in 3.0.
    "imf-reader>=2.0,<3",
    "pyarrow>=20.0.0",
    "wbgapi>=1.0.12,<2",
    "openpyxl>=3.1.5,<4",
    "country-converter>=1.3.1,<2",
    "httpx>=0.28.1,<1",
    "camelot-py>=1.0.9",
    "diskcache>=5.6.3,<6",
    # Imported directly by the importers but only ever resolved transitively
    # before the move, so a dependency dropping one of them broke us silently.
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "requests>=2.32",
    "platformdirs>=4.0",
    "urllib3>=2.0",
]

[project.optional-dependencies]
# `places` and `datacommons-tools` are separate distributions, not part of
# this package, so they are not extras here.
#
# `all` and `data-importers` are kept as empty, no-op extras on purpose. Both
# names are load-bearing in the wild: `pip install bblocks[all]` is the
# command in the README and in consumers' Dockerfiles. If either extra
# disappeared, pip would print a "does not provide the extra" warning, exit
# 0, and silently install less than before. Keeping the empty extras keeps
# those commands correct and quiet. Do not "clean up" these two lines.
all = []
data-importers = []

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.13",
    "mkdocs-material>=9.6.14,<10",
    "xlsxwriter>=3.2.5,<4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
# ruff formats fenced Python blocks in Markdown by default; exclude docs so
# reformatting never leaks into unrelated README/CHANGELOG diffs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Selected explicitly rather than inherited: ruff's implicit default set widens
# between releases, and an unpinned `ruff>=0.13` would then fail CI on code
# nobody touched. Widening this set is issue #208's call, family-wide.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "network: reaches a live third-party API, so it fails when that service does",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export; the names are unused by design.
"__init__.py" = ["F401"]

[project.urls]
repository = "https://github.com/ONEcampaign/bblocks"
documentation = "https://docs.one.org/tools/bblocks/"
homepage = "https://docs.one.org/tools/bblocks/"
