[project]
name = "bblocks"
version = "2.2.0"
description = "Building blocks for development data."
authors = [
    {name = "ONE Campaign"},
    {name = "Luca Picci",email = "lpicci96@gmail.com"},
    {name = "Jorge Rivera", email = "jorge.rivera@one.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas>=2.2.3,<3",
    "imf-reader>=1.3.0,<2",
    "pyarrow>=20.0.0,<21",
    "wbgapi>=1.0.12,<2",
    "openpyxl>=3.1.5,<4",
    "country-converter>=1.3.1,<2",
    "httpx>=0.28.1,<1",
    "camelot-py>=1.0.9",
    "diskcache>=5.6.3,<6",
    # Imported directly by the importers but only ever resolved transitively
    # before the move, so a dependency dropping one of them broke us silently.
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "requests>=2.32",
    "platformdirs>=4.0",
    "urllib3>=2.0",
]

[project.optional-dependencies]
places = ["bblocks-places>=0.0.5"]
data-importers = ["bblocks-data-importers>=0.5.0"]
datacommons-tools = ["bblocks-datacommons-tools>=0.0.2,<0.1.0"]
all = [
    "bblocks-places>=0.0.5",
    "bblocks-data-importers>=0.5.0",
    "bblocks-datacommons-tools>=0.0.2,<0.1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.13",
    "mkdocs-material>=9.6.14,<10",
    "xlsxwriter>=3.2.5,<4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
# ruff formats fenced Python blocks in Markdown by default; exclude docs so
# reformatting never leaks into unrelated README/CHANGELOG diffs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Selected explicitly rather than inherited: ruff's implicit default set widens
# between releases, and an unpinned `ruff>=0.13` would then fail CI on code
# nobody touched. Widening this set is issue #208's call, family-wide.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "network: reaches a live third-party API, so it fails when that service does",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files exist to re-export; the names are unused by design.
"__init__.py" = ["F401"]

[project.urls]
repository = "https://github.com/ONEcampaign/bblocks"
documentation = "https://docs.one.org/tools/bblocks/"
homepage = "https://docs.one.org/tools/bblocks/"
