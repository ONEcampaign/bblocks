# this workflow runs unit tests and checks code style
# for different versions of python on different operating systems

name: tests

on:
  push:
    branches: [main]
  # No base-branch filter. A pull_request filter on [main] only matches PRs
  # targeting main, so in a stack every PR except the bottom one runs no
  # tests and shows a reviewer no checks at all.
  pull_request:
  schedule:
    # v2-resolvability depends on live PyPI state, not on anything in this
    # repo, so a weekly run is what actually catches drift between releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.py }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, py: "3.14" }
          - { os: ubuntu-latest, py: "3.13" }
          - { os: ubuntu-latest, py: "3.12" }
          - { os: windows-latest, py: "3.12" }
          - { os: macOS-latest, py: "3.12" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.config.py }}

      - name: Install package
        run: uv sync

      - name: Test with pytest
        run: uv run pytest tests/ -m "not network"

      - name: Check code style
        run: |
          uv run ruff format --check
          uv run ruff check

  packaging:
    runs-on: ubuntu-latest
    name: build wheel and verify contents
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/*.whl > wheel_contents.txt
          cat wheel_contents.txt

          if ! grep -q "bblocks/__init__.py" wheel_contents.txt; then
            echo "::error::wheel is missing bblocks/__init__.py"
            exit 1
          fi

          if grep -q "bblocks/data_importers/" wheel_contents.txt; then
            echo "::error::wheel must not contain any path under bblocks/data_importers/ (that distribution still owns those paths)"
            exit 1
          fi

          echo "wheel contents OK"

  v2-resolvability:
    runs-on: ubuntu-latest
    name: bblocks 2.x still resolves to the same install set
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dry-run resolve bblocks[all]==2.2.0 against real PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --quiet --report report.json "bblocks[all]==2.2.0"

      - name: Assert bblocks-data-importers still resolves to 0.5.0
        run: |
          python - <<'EOF'
          import json
          import sys

          with open("report.json") as f:
              report = json.load(f)

          resolved = {
              item["metadata"]["name"]: item["metadata"]["version"]
              for item in report["install"]
          }

          got = resolved.get("bblocks-data-importers")
          expected = "0.5.0"

          if got != expected:
              print(
                  "::error::pip install 'bblocks[all]==2.2.0' resolved "
                  f"bblocks-data-importers=={got!r}, expected {expected!r}. "
                  "This means the bblocks 2.x install set has drifted from "
                  "what it resolved to when 2.2.0 was released -- #209 "
                  "requires 'pip install bblocks==2.*' to keep resolving to "
                  "the same package set indefinitely, since the 3.0 rewrite "
                  "assumes old installs are pinned in place. Investigate "
                  "what changed on PyPI (e.g. bblocks-data-importers 0.5.0 "
                  "was yanked) and, if needed, re-release a corrected "
                  "bblocks 2.2.x."
              )
              sys.exit(1)

          print(f"OK: bblocks[all]==2.2.0 still resolves bblocks-data-importers=={got}")
          EOF
