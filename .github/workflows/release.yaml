# this workflow will upload the package to pypi when a new release is created
#
# publishing uses PyPI Trusted Publishing (OIDC) instead of a long-lived API
# token, so the "bblocks" project on PyPI must have a trusted publisher
# configured for this repo/workflow before a release will succeed:
# https://docs.pypi.org/trusted-publishers/
name: release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release:
    name: Release package to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    # Scopes the OIDC claim and gives the publish a place to hang protection
    # rules. The environment name has to match the one on the PyPI publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/bblocks

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.11"

      - name: Build wheels and source tarball
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          verify_metadata: true
          verbose: true
